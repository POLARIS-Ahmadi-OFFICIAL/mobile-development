name: Mobile release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install

      - name: Build iOS (IPA)
        id: build-ios
        run: |
          BUILD_URL=$(eas build --platform ios --profile production --non-interactive --json --no-wait | jq -r '.[0].id')
          echo "build_id=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Build Android (APK)
        id: build-android
        run: |
          BUILD_URL=$(eas build --platform android --profile production --non-interactive --json --no-wait | jq -r '.[0].id')
          echo "build_id=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for iOS build and download
        run: |
          eas build:wait --id ${{ steps.build-ios.outputs.build_id }}
          URL=$(eas build:view --id ${{ steps.build-ios.outputs.build_id }} --json | jq -r '.artifacts.buildUrl')
          curl -L "$URL" -o POLARIS-ios-${{ github.ref_name }}.ipa
          zip POLARIS-ios-${{ github.ref_name }}.zip POLARIS-ios-${{ github.ref_name }}.ipa

      - name: Wait for Android build and download
        run: |
          eas build:wait --id ${{ steps.build-android.outputs.build_id }}
          URL=$(eas build:view --id ${{ steps.build-android.outputs.build_id }} --json | jq -r '.artifacts.buildUrl')
          curl -L "$URL" -o POLARIS-android-${{ github.ref_name }}.apk
          zip POLARIS-android-${{ github.ref_name }}.zip POLARIS-android-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: polaris-mobile
          path: "*.zip"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: polaris-mobile
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
