name: Mobile release

on:
  push:
    tags: ["v*"]

jobs:
  build-ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install
      - name: Build iOS and download
        run: |
          URL=$(eas build --platform ios --profile production --non-interactive --wait --json | jq -r '.[0].artifacts.buildUrl')
          curl -L "$URL" -o POLARIS-ios-${{ github.ref_name }}.ipa
          zip POLARIS-ios-${{ github.ref_name }}.zip POLARIS-ios-${{ github.ref_name }}.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: polaris-ios
          path: "*.zip"

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install
      - name: Build Android and download
        run: |
          URL=$(eas build --platform android --profile production --non-interactive --wait --json | jq -r '.[0].artifacts.buildUrl')
          curl -L "$URL" -o POLARIS-android-${{ github.ref_name }}.apk
          zip POLARIS-android-${{ github.ref_name }}.zip POLARIS-android-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v7
        with:
          name: polaris-android
          path: "*.zip"

  release:
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.zip
          generate_release_notes: true
